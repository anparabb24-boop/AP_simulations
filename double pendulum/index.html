<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double Pendulum Simulation</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">PHYSICS SIMULATION</p>
        <h1>Double Pendulum</h1>
        <p class="subtitle">
          A browser-based version of the double-pendulum simulation from Python.
        </p>
      </div>
    </header>

    <section class="simulation-card">
      <div class="canvas-wrap">
        <canvas id="simulationCanvas"></canvas>
      </div>

      <div class="controls">
        <button id="playButton" class="button primary">▶ Play</button>
        <button id="pauseButton" class="button">⏸ Pause</button>
        <button id="resetButton" class="button">↻ Reset</button>

        <div class="time">
          <span>Simulation time</span>
          <strong id="timeDisplay">time = 0.0s</strong>
        </div>
      </div>
    </section>

    <section class="info-card">
      <h2>Simulation parameters</h2>
      <div class="parameters">

        <div class="parameter">
          <label for="inputGravity">Gravity (m/s²)</label>
          <input type="number" id="inputGravity" value="9.8" step="0.1" min="0" />
        </div>
        
        <div class="parameter">
          <label for="inputL1">Rod 1 length (m)</label>
          <input type="number" id="inputL1" value="1.0" step="0.1" min="0.1" />
        </div>
        
        <div class="parameter">
          <label for="inputL2">Rod 2 length (m)</label>
          <input type="number" id="inputL2" value="1.0" step="0.1" min="0.1" />
        </div>

        <div class="parameter">
          <label for="inputM1">Mass 1 (kg)</label>
          <input type="number" id="inputM1" value="5.0" step="0.5" min="0.1" />
        </div>

        <div class="parameter">
          <label for="inputM2">Mass 2 (kg)</label>
          <input type="number" id="inputM2" value="5.0" step="0.5" min="0.1" />
        </div>

        <div class="parameter">
          <label for="inputTh1">Initial Angle 1 (°)</label>
          <input type="number" id="inputTh1" value="90" step="1" />

        </div>
      </div>
    </section>
  </main>

  <script src="double_pendulum.js"></script>
</body>
</html>
