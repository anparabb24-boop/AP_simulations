<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Physics Simulations Workspace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-top">
        <p class="eyebrow">PHYSICS SIMULATION WORKSPACE</p>
        <nav class="sim-nav">
          <button id="navPendulum" class="nav-btn active">Double Pendulum</button>
          <button id="navEField" class="nav-btn">Delayed E-Field</button>
        </nav>
      </div>
      <h1 id="simTitle">Double Pendulum</h1>
      <p id="simSubtitle" class="subtitle">
        A browser-based interactive double-pendulum simulation.
      </p>
    </header>

    <!-- Double Pendulum View -->
    <div id="viewPendulum" class="sim-view">
      <section class="simulation-card">
        <div class="canvas-wrap">
          <canvas id="simulationCanvas"></canvas>
        </div>
        <div class="controls">
          <button id="playButton" class="button primary">▶ Play</button>
          <button id="pauseButton" class="button">⏸ Pause</button>
          <button id="resetButton" class="button">↻ Reset</button>
          <div class="time">
            <span>Simulation time</span>
            <strong id="timeDisplay">time = 0.0s</strong>
          </div>
        </div>
      </section>

      <section class="info-card">
        <h2>Simulation parameters</h2>
        <div class="parameters">
          <div class="parameter">
            <label for="inputL1">Rod 1 length (m)</label>
            <input type="number" id="inputL1" value="1.0" step="0.1" min="0.1" />
          </div>
          <div class="parameter">
            <label for="inputL2">Rod 2 length (m)</label>
            <input type="number" id="inputL2" value="1.0" step="0.1" min="0.1" />
          </div>
          <div class="parameter">
            <label for="inputTh1">Angle 1 (°)</label>
            <input type="number" id="inputTh1" value="90" step="1" />
          </div>
          <div class="parameter">
            <label for="inputTh2">Angle 2 (°)</label>
            <input type="number" id="inputTh2" value="90" step="1" />
          </div>
          <div class="parameter">
            <label for="inputM1">Mass 1 (kg)</label>
            <input type="number" id="inputM1" value="5.0" step="0.5" min="0.1" />
          </div>
          <div class="parameter">
            <label for="inputM2">Mass 2 (kg)</label>
            <input type="number" id="inputM2" value="5.0" step="0.5" min="0.1" />
          </div>
          <div class="parameter">
            <label for="inputTStop">Max Sim Time (s)</label>
            <input type="number" id="inputTStop" value="10" step="1" min="1" />
          </div>
        </div>
      </section>
    </div>

    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/FontUtils.js"></script>

    <!-- Electric Field View -->
    <div id="viewEField" class="sim-view" style="display: none;">
      <section class="simulation-card">
        <div class="canvas-wrap">
          <canvas id="efieldCanvas"></canvas>
        </div>
        <div class="controls">
          <button id="efPlayButton" class="button primary">▶ Play</button>
          <button id="efPauseButton" class="button">⏸ Pause</button>
          <button id="efResetButton" class="button">↻ Reset</button>
          <div class="time">
            <span>Time</span>
            <strong id="efTimeDisplay">t = 0.0s</strong>
          </div>
        </div>
      </section>

      <section class="info-card">
        <h2>Electrodynamic Parameters</h2>
        <div class="parameters">
          <div class="parameter">
            <label for="inputQ">Charge q</label>
            <input type="number" id="inputQ" value="2" step="0.5" />
          </div>
          <div class="parameter">
            <label for="inputPosX">x(t) Motion Equation</label>
            <input type="text" id="inputPosX" value="0" />
          </div>
          <div class="parameter">
            <label for="inputPosY">y(t) Motion Equation</label>
            <input type="text" id="inputPosY" value="0" />
          </div>
          <div class="parameter">
            <label for="inputPosZ">z(t) Motion Equation</label>
            <input type="text" id="inputPosZ" value="5 * Math.sin(0.25 * t)" />
          </div>
          <div class="parameter"><label for="selectPlane">Field Grid Plane</label><select id="selectPlane"><option value="XY" selected>XY Plane (Z = 0)</option>
            <option value="YZ">YZ Plane (X = 0)</option>
            <option value="XZ">XZ Plane (Y = 0)</option>
          </select>
        </div>
      </div>
    </section>
  </div>
</div>
</section>

  <script src="double_pendulum.js"></script>
  <script src="electric_field.js"></script>
  <script src="app_router.js"></script>
</body>
</html>
